services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/uploads
      - JWT_SECRET=troque-este-segredo-para-algo-aleatorio-e-privado
      - COOKIE_SECURE=false
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
